name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install pytest
          # must succeed — a package that cannot be installed is not shippable
          pip install -e .
      - name: Import smoke (run outside the repo — cwd can't fake this)
        run: python -c "import fleet_murmur; print(fleet_murmur.__file__)"
        working-directory: /tmp
      - name: Test (the merge gate)
        run: python -m pytest --tb=short -q
      - name: Seal CLI smoke (seal a file · diff it · verify the chain)
        run: |
          python tools/murmur_seal.py seal README.md
          python tools/murmur_seal.py diff README.md
          python tools/murmur_seal.py verify
