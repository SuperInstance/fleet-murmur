[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fleet-murmur"
version = "0.1.0"
description = "Lightweight gossip protocol for agent fleet communication"
authors = [{ name = "SuperInstance" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.8"
keywords = ["gossip", "fleet", "murmur", "protocol", "distributed"]

[project.urls]
Source = "https://github.com/SuperInstance/fleet-murmur"

[tool.setuptools.packages.find]
include = ["fleet_murmur*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
